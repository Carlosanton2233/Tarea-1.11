<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tarea 1.11 - Tablas HTML</title>
    <!-- Los bordes van en CSS y no en atributos como border o align para separar el diseño de la estructura HTML -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- table: Crea una tabla en HTML -->
    <table>
        <!-- caption: Define el título de la tabla -->
        <caption>Horario de 1º DAW</caption>

        <!-- tr: Crea una fila en la tabla -->
        <tr>
            <!-- th: Celda de encabezado (en negrita) -->
            <th>Hora</th>
            <th>Lunes</th>
            <th>Martes</th>
            <th>Miércoles</th>
            <th>Jueves</th>
            <th>Viernes</th>
        </tr>
    </table>

</body>

</html>
